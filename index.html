<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yaoyao Gu</title>
  <meta name="description" content="Yaoyao Gu · 手机部-软件部-架构设计部">
  <style>
    :root {
      --bg: #fafafa;
      --fg: #1a1a1a;
      --muted: #6b7280;
      --accent: #2563eb;
      --line: #e5e7eb;
      --card: #ffffff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d0d0f;
        --fg: #e8e8ea;
        --muted: #9ca3af;
        --accent: #60a5fa;
        --line: #26262b;
        --card: #16161a;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                   "Hiragino Sans GB", "Microsoft YaHei", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--fg);
      line-height: 1.65;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }
    .wrap {
      width: 100%;
      max-width: 680px;
      margin: 0 auto;
      padding: 0 24px;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    header {
      padding: 96px 0 40px;
    }
    .avatar {
      width: 84px;
      height: 84px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), #7c3aed);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 32px;
      font-weight: 600;
      letter-spacing: 1px;
      margin-bottom: 28px;
      user-select: none;
    }
    h1 {
      font-size: 40px;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 12px;
    }
    .role {
      font-size: 16px;
      color: var(--muted);
      display: inline-flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .role .dept {
      padding: 3px 10px;
      border: 1px solid var(--line);
      border-radius: 999px;
      font-size: 14px;
    }
    main {
      padding: 8px 0 40px;
    }
    .section {
      padding: 28px 0;
      border-top: 1px solid var(--line);
    }
    .section h2 {
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin-bottom: 14px;
    }
    .section p { color: var(--fg); }
    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }
    .links a {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 16px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 10px;
      color: var(--fg);
      text-decoration: none;
      font-size: 15px;
      transition: border-color .15s ease, transform .15s ease;
    }
    .links a:hover {
      border-color: var(--accent);
      transform: translateY(-1px);
    }
    .links svg { width: 18px; height: 18px; fill: currentColor; opacity: .85; }
    footer {
      padding: 32px 0;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
    }
    @media (max-width: 480px) {
      header { padding: 64px 0 32px; }
      h1 { font-size: 32px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="avatar" aria-hidden="true">YG</div>
      <h1>Yaoyao Gu</h1>
      <div class="role">
        <span class="dept">手机部</span>
        <span class="dept">软件部</span>
        <span class="dept">架构设计部</span>
      </div>
    </header>

    <main>
      <section class="section">
        <h2>About</h2>
        <p>专注于软件架构设计。</p>
      </section>

      <section class="section">
        <h2>Links</h2>
        <div class="links">
          <a href="https://github.com/tenderzada" target="_blank" rel="noopener">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 .5C5.7.5.5 5.7.5 12c0 5.1 3.3 9.4 7.9 10.9.6.1.8-.2.8-.5v-2c-3.2.7-3.9-1.4-3.9-1.4-.5-1.3-1.3-1.7-1.3-1.7-1.1-.7.1-.7.1-.7 1.2.1 1.8 1.2 1.8 1.2 1 1.8 2.7 1.3 3.4 1 .1-.8.4-1.3.7-1.6-2.6-.3-5.3-1.3-5.3-5.8 0-1.3.5-2.3 1.2-3.1-.1-.3-.5-1.5.1-3.1 0 0 1-.3 3.3 1.2a11.5 11.5 0 0 1 6 0C17.3 4.7 18.3 5 18.3 5c.6 1.6.2 2.8.1 3.1.8.8 1.2 1.8 1.2 3.1 0 4.5-2.7 5.5-5.3 5.8.4.4.8 1.1.8 2.2v3.3c0 .3.2.6.8.5 4.6-1.5 7.9-5.8 7.9-10.9C23.5 5.7 18.3.5 12 .5z"/></svg>
            GitHub
          </a>
        </div>
      </section>
    </main>

    <footer>
      © <span id="year"></span> Yaoyao Gu
    </footer>
  </div>
  <script>document.getElementById('year').textContent = new Date().getFullYear();</script>
</body>
</html>
